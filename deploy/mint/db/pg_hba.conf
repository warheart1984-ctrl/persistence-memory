# TYPE  DATABASE  USER             ADDRESS    METHOD
#
# The bootstrap superuser works only through the local socket as the container's own postgres OS user
# (docker exec -u postgres ...). It has no network login and no password anyone needs to know.
local   all       postgres                    peer
local   all       all                         reject

# The two ledger roles, from containers on the ledger network only.
host    jarvis    jarvis_app       samenet    scram-sha-256
host    jarvis    jarvis_migrator  samenet    scram-sha-256

# Everything else is refused, superuser over the network included.
host    all       all              all        reject
