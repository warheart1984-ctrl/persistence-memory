# Minimal, explicit configuration for a small single-user ledger (replaces the image's sample file).

listen_addresses = '*'            # inside the container only; nothing is published to the host
port = 5432
unix_socket_directories = '/var/run/postgresql'
hba_file = '/etc/postgresql/pg_hba.conf'
ident_file = '/etc/postgresql/pg_ident.conf'
max_connections = 30              # the app pool is 10; headroom for admin, backups and the migrator

# Reap the sessions of clients that have vanished.  With the operating system's default (two hours) a client that is cut off, or killed without a reset reaching
# us, keeps its connection slots for two hours; with max_connections this small, three such incidents lock the application out of its own database (the chaos
# partition fault stranded 6-7 sessions per run and exhausted the 30).  A client that closed its socket answers the first probe with a reset and is reaped after
# tcp_keepalives_idle; one that is unreachable is reaped after idle + interval x count (60 s).
tcp_keepalives_idle = 30
tcp_keepalives_interval = 10
tcp_keepalives_count = 3
tcp_user_timeout = 30s

password_encryption = scram-sha-256
ssl = off                         # private container network; add TLS if the database is ever exposed

shared_buffers = 128MB
dynamic_shared_memory_type = posix

# Durability: never trade it away for speed on a ledger.
fsync = on
synchronous_commit = on
full_page_writes = on
wal_level = replica

# Logging (to the container log, rotated by Docker). DDL and connections are audited; ordinary
# statements are not logged. Role-password statements are never logged (see initdb/10-roles.sh).
log_destination = 'stderr'
logging_collector = off
log_statement = 'ddl'
log_connections = on
log_disconnections = on
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %u@%d '
log_timezone = 'UTC'
timezone = 'UTC'
