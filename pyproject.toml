[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-memoryboard"
version = "0.2.0"
description = "Continuity Ledger HTTP service (distributed as persistence-memory) — evidence-backed agent memory"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "python-dotenv==1.2.2",
  "pydantic==2.11.7",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[project.urls]
Repository = "https://github.com/warheart1984-ctrl/persistence-memory"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
