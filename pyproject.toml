[project]
name = "jarvis-memoryboard"
version = "0.1.0"
description = "Jarvis memory board — persistent read/write memory for MRS agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "python-dotenv==1.2.2",
  "pydantic==2.11.7",
  "networkx>=3.0",
  "PyJWT[crypto]==2.10.1",
  "psycopg[binary]==3.2.9",
  # amul_llm calls its backend with httpx at runtime, not only in tests.
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*", "mcp_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
