# Jarvis Memoryboard — Render blueprint
# Repo: warheart1984-ctrl/persistence-memory (or monorepo subdir)
# Docs: docs/DEPLOY_RENDER.md

services:
  - type: web
    name: jarvis-memoryboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: jarvis-ledger
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: RENDER
        value: "true"
      - key: JARVIS_STORE_PATH
        value: /var/data/jarvis-store.json
      - key: JARVIS_EMR_DYNAMICS_PATH
        value: /var/data/emr-dynamics.json
      - key: JARVIS_AMUL_PATH
        value: /var/data/amul-field.jsonl
      - key: JARVIS_MEMORY_WRITE_ENABLED
        value: "false"
      # Recall-only on public deploy. Operator may set true on a private host only.
      - key: JARVIS_MCP_WRITE_ENABLED
        value: "false"
      - key: JARVIS_PROTECT_LEDGER_READ
        value: "true"
      - key: JARVIS_PUBLIC_MODE
        value: "true"
      # Public directory mode: OAuth identity selects an isolated ledger per subject.
      # Configure issuer, audience, JWKS URL, and support email in Render before enabling.
      - key: JARVIS_AUTH_MODE
        value: operator
      - key: JARVIS_PUBLIC_BASE_URL
        value: https://jarvis-memoryboard-teu9.onrender.com
      - key: JARVIS_TENANT_STORE_DIR
        value: /var/data/tenants
      # Render PostgreSQL internal connection string; do not commit its value.
      - key: JARVIS_DATABASE_URL
        sync: false
      - key: JARVIS_OIDC_ISSUER
        sync: false
      - key: JARVIS_OIDC_AUDIENCE
        sync: false
      - key: JARVIS_OIDC_JWKS_URL
        sync: false
      - key: JARVIS_SUPPORT_EMAIL
        sync: false
      - key: JARVIS_TRUSTED_HOSTS
        value: jarvis-memoryboard-teu9.onrender.com
      - key: JARVIS_CORS_ORIGINS
        value: "https://chatgpt.com,https://chat.openai.com"
      # Set in Render dashboard (sync: false) — required for public recall
      - key: EMR_RECALL_API_KEY
        sync: false
